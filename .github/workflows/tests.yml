name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Operations case study tests
        run: python -m pytest -q projects/ai-assisted-operations-improvement/tests
      - name: Reports are reproducible from the committed data
        working-directory: projects/ai-assisted-operations-improvement
        run: |
          python src/generate_data.py
          python src/evaluate.py
          git diff --exit-code -- data reports
